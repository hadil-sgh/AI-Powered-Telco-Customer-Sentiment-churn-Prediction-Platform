<div class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-lg overflow-hidden w-full max-w-md">
    <div class="p-8">
      <div class="text-center mb-6">
        <img
          src="assets/img/logoOoredoo.png"
          class="mx-auto w-60"
          alt="Ooredoo Logo"
        />
        <h2 class="text-2xl font-bold text-gray-800">Account Verification</h2>
        <p class="text-gray-600 mt-2">
          We've sent a 6-digit verification number to your Email
        </p>
      </div>

      <div [class.hidden]="showSuccess">
        <div class="flex justify-center mb-6">
          <!-- 6 digit inputs -->
          <input
            #digitInput
            type="text"
            maxlength="1"
            class="digit"
            inputmode="numeric"
            pattern="[0-9]*"
            [attr.autofocus]="i === 0 ? true : null"
            (input)="onDigitInput($event, i)"
            (keydown)="onDigitKeydown($event, i)"
            (paste)="onDigitPaste($event, i)"
            *ngFor="let digit of [1, 2, 3, 4, 5, 6]; let i = index"
          />
        </div>

        <div class="progress-bar">
          <div class="progress" [style.width.%]="progress"></div>
        </div>

        <div class="flex justify-between items-center mt-4 text-sm">
          <span class="text-gray-500 font-medium">{{ timerDisplay }}</span>
          <button
            [disabled]="!canResend || isResending"
            [class.opacity-50]="!canResend || isResending"
            [class.cursor-not-allowed]="!canResend || isResending"
            class="text-red-600 font-medium"
            (click)="onResendCode()"
          >
            {{ isResending ? "Sending..." : "Resend Code" }}
          </button>
        </div>

        <!-- Error message -->
        <div
          *ngIf="errorMessage"
          class="mt-4 text-center text-red-500 font-medium"
        >
          {{ errorMessage }}
        </div>

        <button
          [disabled]="!allDigitsFilled || isVerifying"
          [class.bg-ooredoo-red]="allDigitsFilled && !isVerifying"
          [class.hover:bg-red-700]="allDigitsFilled && !isVerifying"
          [class.bg-gray-300]="!allDigitsFilled || isVerifying"
          class="w-full mt-6 text-white font-medium py-3 px-4 rounded-lg transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
          (click)="onVerifyAccount()"
        >
          <span *ngIf="isVerifying">
            <i class="fas fa-spinner fa-spin mr-2"></i>Verifying...
          </span>
          <span *ngIf="!isVerifying">Verify Account</span>
        </button>
      </div>

      <div [class.hidden]="!showSuccess" class="text-center">
        <svg
          class="check-icon w-14 h-14 mx-auto text-green-500 mb-6"
          viewBox="0 0 52 52"
        >
          <circle
            cx="26"
            cy="26"
            r="25"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="5"
            d="M14.1 27.2l7.1 7.2 16.7-16.8"
          />
        </svg>
        <h3 class="text-2xl font-bold text-gray-800 mb-2">
          Verification Successful!
        </h3>
        <p class="text-gray-600 mb-6">
          Your account has been successfully verified.
        </p>
        <button
          class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 px-4 rounded-lg transition duration-300"
          (click)="onContinueToDashboard()"
        >
          Continue to Dashboard
        </button>
      </div>
    </div>
  </div>
</div>
