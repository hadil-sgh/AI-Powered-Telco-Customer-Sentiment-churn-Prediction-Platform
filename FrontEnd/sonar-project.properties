# Required
sonar.projectKey=angular-frontend
sonar.projectName=Angular Frontend
sonar.projectVersion=1.0

# Sources
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/assets/**

# Language & Encoding
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Tests
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Coverage Report (from Jest or Karma)
sonar.typescript.lcov.reportPaths=coverage/lcov.info
