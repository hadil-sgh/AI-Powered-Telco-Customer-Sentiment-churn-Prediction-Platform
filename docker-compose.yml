version: '3'

services:
  prometheus:
    container_name: pfeplatformpipeline-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - devops-network

  nexus:
    container_name: pfeplatformpipeline-nexus
    image: sonatype/nexus3:latest
    ports:
      - "8081:8081"
    networks:
      - devops-network

  grafana:
    container_name: pfeplatformpipeline-grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - devops-network
    depends_on:
      - prometheus

  sonarqube:
    container_name: pfeplatformpipeline-sonarqube
    image: sonarqube:latest
    ports:
      - "9000:9000"
    networks:
      - devops-network

volumes:
  prometheus_data:

networks:
  devops-network:
    driver: bridge
