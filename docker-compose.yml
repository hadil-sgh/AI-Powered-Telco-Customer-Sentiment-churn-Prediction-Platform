version: '3'

services:
  prometheus:
    container_name: pfeplatformpipeline-prometheus
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - devops-network

  nexus:
    container_name: pfeplatformpipeline-nexus
    image: sonatype/nexus3:latest
    ports:
      - "8081:8081"
    environment:
      - NEXUS_SECURITY_RANDOMPASSWORD=false # Disable random password generation
      - NEXUS_PASSWORD=your_nexus_password_here # Set the Nexus password
    volumes:
      - nexus_data:/nexus-data
    networks:
      - devops-network

  grafana:
    container_name: pfeplatformpipeline-grafana
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=your_grafana_password_here # Set the Grafana password
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - devops-network
    depends_on:
      - prometheus

  sonarqube:
    container_name: pfeplatformpipeline-sonarqube
    image: sonarqube:latest
    ports:
      - "9000:9000"
    environment:
      - SONARQUBE_JDBC_URL=jdbc:postgresql://your-database:5432/sonar
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD=your_sonar_db_password
      - SONARQUBE_PASSWORD=your_sonarqube_admin_password_here # Set the SonarQube admin password
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - devops-network

volumes:
  prometheus_data:
  nexus_data:
  grafana_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  devops-network:
    driver: bridge
