services:
  postgres:
    container_name: postgres-db
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: Costumer_Retention
    volumes:
      - postgres:/data/postgres
    ports:
        - 5432:5432
    networks:
        - springboot-network
    restart: unless-stopped

  MailDev:
    container_name: mail-dev-CRP
    image: maildev/maildev
    ports:
      - 1080:1080 # Web interface
      - 1025:1025 # SMTP server
    networks:
      - springboot-network
    restart: unless-stopped

networks:
  springboot-network:
    driver: bridge

volumes:
  postgres:
    driver: local
