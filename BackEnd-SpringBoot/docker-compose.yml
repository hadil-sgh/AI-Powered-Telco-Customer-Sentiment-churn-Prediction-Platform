services:
  postgres:
    container_name: postgres-sql-CSM
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB : AI-Powered-Telco-Customer-Sentiment-churn-Prediction-Platform
    volumes:
      - postgres:/data/postgres
    ports:
      - 5432:5432 #Public:Container
    networks:
      - spring-PFE
    restart: unless-stopped

  mail-dev:
    container_name: mail-dev-CSM
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025

networks:
  spring-PFE:
    driver: bridge

volumes:
  postgres:
    driver: local
