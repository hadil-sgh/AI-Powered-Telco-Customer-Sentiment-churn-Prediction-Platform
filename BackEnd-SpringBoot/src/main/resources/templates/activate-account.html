<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ooredoo Registration Confirmation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .email-wrapper {
            max-width: 600px;
            margin: auto;
            padding: 30px 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }
        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .header img {
            max-height: 50px;
        }
        .content {
            padding: 20px 0;
            line-height: 1.6;
        }
        .greeting {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .activation-code {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin: 30px 0;
            color: #d71920;
            letter-spacing: 3px;
        }
        .cta-button {
            text-align: center;
            margin-top: 30px;
        }
        .cta-button a {
            background-color: #d71920;
            color: #fff;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            text-align: center;
            color: #777;
        }
        @media (max-width: 600px) {
            .email-wrapper {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
<div class="email-wrapper">
    <div class="header">
        <img src="https://www.ooredoo.com/wp-content/uploads/2015/12/Ooredoo-Logo_CMYK_On-White-BG_FA-01.png" alt="Ooredoo Logo">
        <h2>Call Center Registration</h2>
    </div>
    <div class="content">
        <p class="greeting" th:text="'Hello ' + ${username} + ','"></p>
        <p>Thank you for registering for the Ooredoo Call Center platform.</p>
        <p>Please use the activation code below to verify your account:</p>
        <div class="activation-code" th:text="${activation_code}"></div>
        <div class="cta-button">
            <a th:href="${confirmationUrl}" href="#" target="_blank">Activate My Account</a>
        </div>
    </div>
    <div class="footer">
        If you did not request this registration, please ignore this email.<br>
        &copy; 2025 Ooredoo. All rights reserved.
    </div>
</div>
</body>
</html>
